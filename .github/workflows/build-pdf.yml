name: Build Book PDF

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install TeX Live and XeLaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          texlive-xetex \
          texlive-lang-arabic \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-latex-extra \
          texlive-latex-recommended \
          texlive-science \
          texlive-games \
          fonts-freefont-ttf \
          fonts-dejavu

    - name: Install Vazirmatn Font
      run: |
        sudo mkdir -p /usr/share/fonts/truetype/vazirmatn
        sudo cp fonts/*.ttf /usr/share/fonts/truetype/vazirmatn/
        sudo fc-cache -f -v

    - name: Compile Book with XeLaTeX
      run: |
        xelatex -interaction=nonstopmode -output-driver="xdvipdfmx -V 5" -jobname=book-fa book.tex || true
        makeindex book-fa.idx || true
        xelatex -interaction=nonstopmode -output-driver="xdvipdfmx -V 5" -jobname=book-fa book.tex || true
        ls -lh book-fa.pdf
        test -f book-fa.pdf

    - name: Upload PDF Artifact
      uses: actions/upload-artifact@v4
      with:
        name: book-persian
        path: book-fa.pdf

    - name: Release PDF
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
      with:
        tag_name: latest
        name: Persian Competitive Programmer's Handbook PDF
        body: "نسخه کامل ترجمه فارسی کتاب راهنمای برنامه‌نویس رقابتی (Competitive Programmer's Handbook)"
        files: book-fa.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
